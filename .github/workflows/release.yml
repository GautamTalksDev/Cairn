# Release integrity (CP-27).
# Build sdist/wheel + SBOM for version tags, attach to a GitHub Release, and
# mint Sigstore build-provenance attestations. PyPI Trusted Publishing is
# documented in RELEASING.md / docs/repository-settings.md and is not enabled
# until deliberately turned on (no long-lived PyPI token).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install "build==1.2.2.post1" "cyclonedx-bom==7.3.1"
          python -m build
          cyclonedx-py requirements requirements.lock.txt \
            --pyproject pyproject.toml \
            --mc-type library \
            --of JSON \
            -o dist/sbom.json \
            --output-reproducible
          ls -la dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cairn-dist
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json
          generate_release_notes: true
          fail_on_unmatched_files: true
