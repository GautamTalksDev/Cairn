# Dependency vulnerability scanning + release SBOM (CP-23 / CP-24).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — catch newly published advisories.
    - cron: "0 6 * * 1"
  release:
    types: [published]

# Least privilege by default. Write scopes are granted only on jobs that
# cannot run for fork pull requests (see osv-sarif-upload / sbom).
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only token only — safe for fork PRs (no secrets, no write scopes).
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"

      - name: pip-audit (locked dependency set)
        run: |
          # Fail the job on any known vulnerability in requirements.lock.txt.
          # If a finding must be accepted temporarily, document the advisory ID
          # and rationale in docs/dependency-audit.md and pass
          #   pip-audit ... --ignore-vuln <ID>
          pip-audit -r requirements.lock.txt \
            --progress-spinner off \
            --format json \
            --output pip-audit.json
          pip-audit -r requirements.lock.txt --progress-spinner off

      - name: Upload pip-audit JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore

      - name: Install osv-scanner
        run: |
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: osv-scanner (lockfile)
        run: |
          osv-scanner scan -L requirements.lock.txt \
            --format sarif \
            --output-file osv-results.sarif
          osv-scanner scan -L requirements.lock.txt --format table

      - name: Upload OSV SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: ignore

  # security-events: write is never granted on fork pull requests.
  osv-sarif-upload:
    needs: dependency-audit
    if: >
      always() &&
      needs.dependency-audit.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download OSV SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osv-scanner-sarif

      - name: Upload OSV SARIF to GitHub Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  sbom:
    # Release events are never fork PRs; contents:read only (artifact upload).
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install "cyclonedx-bom==7.3.1"
          cyclonedx-py requirements requirements.lock.txt \
            --pyproject pyproject.toml \
            --mc-type library \
            --of JSON \
            -o sbom.json \
            --output-reproducible

      - name: Upload sbom.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error
