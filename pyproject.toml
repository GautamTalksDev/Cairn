[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "Integrity monitoring for multi-source robot navigation (protection levels and missed-detection rate)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "GautamTalksDev", email = "developwith.gt@gmail.com" },
]
keywords = [
    "integrity",
    "robotics",
    "navigation",
    "SLAM",
    "protection-level",
    "underground",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime pins. Source of truth for *declared* versions. After changing these,
# regenerate the hash-pinned lock:
#   pip-compile --generate-hashes --output-file=requirements.txt pyproject.toml
# numpy stays on 1.x (<2); scipy stays on 1.17.1 (1.18.0 breaks tests; gtsam ABI).
# See CONTRIBUTING.md. Even though evo (evaluation tooling in
# requirements.lock.txt) also depends on numpy.
dependencies = [
    "numpy==1.26.4",
    "matplotlib==3.11.2",
    "scipy==1.17.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Runtime is the default [project.dependencies] set above.
# Dev tools only — not installed by `pip install .`
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end regression against golden headline numbers (needs data/processed)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cairn"]
exclude = "(?x)(^cairn/_internal/)"

[[tool.mypy.overrides]]
module = [
    "cairn._internal",
    "cairn._internal.*",
]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*"]
ignore_missing_imports = true
